name: release

# Builds and publishes binaries on every version tag (e.g. v0.1.0).
# github.com/magnobit/quell is a public repo, so `go build` resolves it via
# the normal public Go module proxy — no credentials or private-module
# workaround needed here. (It was private earlier in this project; if it
# ever goes private again, this job will need the GOPRIVATE + PAT dance
# back — see git history for the previous version of this file.)

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: |
          mkdir -p dist
          for pair in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64"; do
            set -- $pair
            os=$1; arch=$2
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            out="dist/quell-${os}-${arch}${ext}"
            echo "Building $out"
            GOOS=$os GOARCH=$arch go build -o "$out" .
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
